<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf8f5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>DIARY</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"></head><body>
<header class="top"><div><div class="eyebrow">MY PRIVATE JOURNAL</div><h1>DIARY</h1></div><button id="menuButton" class="iconbtn" aria-label="メニューを開く">☰</button></header>
<main id="home" class="content"><p class="hint">今日のことを、あなたの言葉で。</p><p id="status" class="status" role="status"></p><section id="entries" aria-label="日記一覧"></section></main>
<button id="addButton" class="fab" aria-label="日記を書く">＋</button>
<section id="editor" class="overlay" hidden><header class="bar"><button id="closeEditor" class="plain">キャンセル</button><strong>新しい日記</strong><button id="saveEntry" class="primary">投稿する</button></header><div class="editorbody"><textarea id="entryBody" placeholder="今日はどんな一日だった？" aria-label="日記の本文"></textarea><p id="editorError" class="error" role="alert"></p></div></section>
<section id="settings" class="overlay" hidden><header class="bar"><button id="closeSettings" class="plain">閉じる</button><strong>データの保管</strong><span class="barspace"></span></header><div class="settingsbody"><h2>バックアップ</h2><p>日記をファイルにまとめます。保存先はiPhoneの操作で選んでください。保存したファイルが「このiPhone内」にあるか確認してください。</p><button id="backupButton" class="wide primary">バックアップを作成</button><h2>復元</h2><p>現在の日記は残し、バックアップにしかない日記を追加します。同じIDで本文が異なる場合は別の日記として残します。</p><label class="filepick" for="restoreFile">バックアップファイルを選ぶ</label><input id="restoreFile" type="file" accept=".json,application/json" hidden><p id="settingsStatus" class="status" role="status"></p><div class="warning">注意：iPhone内だけのバックアップは、端末の故障・紛失時に原本と同時に失われる可能性があります。削除した日記も、過去のバックアップから再び復元される場合があります。</div></div></section>
<dialog id="confirmDialog"><form method="dialog"><h2 id="dialogTitle">確認</h2><p id="dialogMessage"></p><div class="actions"><button value="cancel">キャンセル</button><button id="dialogAccept" value="accept" class="danger">続ける</button></div></form></dialog>
<script type="module" src="app.js"></script></body></html>
