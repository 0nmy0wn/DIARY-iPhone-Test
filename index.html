<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf8f5"><title>DIARY | v0.2.0</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"></head><body>
<div class="shell">
<header class="top"><div class="brand"><span class="eyebrow">MY PRIVATE JOURNAL</span><h1>DIARY</h1></div><button id="menuButton" class="icon-btn" aria-label="メニューを開く" aria-expanded="false">☰</button></header>
<main id="home" class="view"><div class="content"><p class="hint">今日のことを、あなたの言葉で。</p><div id="entryList" aria-live="polite"><section class="empty"><p>読み込み中です。</p></section></div></div><button id="newButton" class="fab" aria-label="新しい日記を書く">＋</button></main>
<section id="editor" class="view hidden" aria-label="新規投稿画面"><div class="editorbar"><button id="closeEditor" class="plain">キャンセル</button><strong>新しい日記</strong><button id="submitEntry" class="submit" disabled>投稿する</button></div><div class="editor-inner"><textarea id="body" placeholder="今日はどんな一日だった？" aria-label="日記の本文" maxlength="100000"></textarea><p id="editorStatus" class="notice" role="status"></p></div></section>
<div id="menu" class="overlay hidden"><div class="shade" data-close-menu></div><section class="settings" aria-label="データの保管"><div class="settingsbar"><button id="closeMenu" class="plain">閉じる</button><strong>データの保管</strong><span class="barspace"></span></div><div class="settingsbody"><h2>バックアップ</h2><p>この試験版の日記をJSONファイルに書き出します。保存したファイルは大切に保管してください。</p><button id="backupButton" class="wide">バックアップを作成</button><h2>復元</h2><p>現在の日記を消さずに、バックアップの内容を統合します。同じID・同じ本文は追加せず、同じID・異なる本文は両方残します。</p><button id="restoreButton" class="wide">バックアップを選ぶ</button><input id="restoreFile" type="file" accept=".json,application/json" class="hidden"><p id="storageStatus" class="notice" role="status"></p></div></section></div>
<div id="confirm" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="confirmTitle"><div class="shade"></div><div class="dialog"><h2 id="confirmTitle">入力した文章を破棄しますか？</h2><p>まだ保存されていない文章があります。</p><div class="actions"><button id="keepWriting" class="plain bordered">入力を続ける</button><button id="discard" class="danger">破棄して閉じる</button></div></div></div>
<div id="deleteConfirm" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="deleteTitle"><div class="shade"></div><div class="dialog"><h2 id="deleteTitle">この日記を削除しますか？</h2><p>削除した日記は元に戻せません。必要なら先にバックアップを作成してください。</p><div class="actions"><button id="cancelDelete" class="plain bordered">キャンセル</button><button id="acceptDelete" class="danger">完全に削除</button></div></div></div>
<div id="restoreConfirm" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="restoreTitle"><div class="shade"></div><div class="dialog"><h2 id="restoreTitle">バックアップを統合しますか？</h2><p id="restoreSummary"></p><div class="actions"><button id="cancelRestore" class="plain bordered">キャンセル</button><button id="acceptRestore" class="submit">統合する</button></div></div></div>
<div id="toast" class="toast hidden" role="status"></div></div><script src="./merge.js" defer></script><script src="./ui.js" defer></script></body></html>
